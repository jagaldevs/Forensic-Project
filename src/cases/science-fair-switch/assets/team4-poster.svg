<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Photo of Team 4's science fair poster about algae growth, pinned to a board in a school lab">
  <defs>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Lab wall under ceiling lights -->
  <rect width="800" height="600" fill="#e2e8e4"/>
  <circle cx="400" cy="-40" r="420" fill="url(#glow)"/>

  <!-- Pinboard -->
  <g id="pinboard">
    <rect x="34" y="24" width="732" height="492" fill="#8a6a4a"/>
    <rect x="44" y="34" width="712" height="472" fill="#c9a074"/>
    <path d="M60 160h3v3h-3zM90 300h3v3h-3zM72 420h3v3h-3zM700 60h3v3h-3zM730 210h3v3h-3zM712 260h3v3h-3zM96 220h3v3h-3zM740 440h3v3h-3zM400 46h3v3h-3zM260 52h3v3h-3zM580 50h3v3h-3z" fill="#a8825a"/>
    <g transform="rotate(-4 82 91)">
      <rect x="56" y="56" width="52" height="70" fill="#f6f4ef"/>
      <path d="M62 70h40M62 80h34M62 90h40M62 100h28" stroke="#c9c2b0" stroke-width="2"/>
    </g>
    <rect x="694" y="80" width="52" height="40" fill="#a8cbdc" transform="rotate(2 720 100)"/>
    <rect x="700" y="300" width="46" height="60" fill="#e0b24a" transform="rotate(3 723 330)"/>
    <g fill="#3d8fb3"><circle cx="82" cy="62" r="4"/><circle cx="720" cy="84" r="4"/><circle cx="723" cy="304" r="4"/></g>
  </g>

  <!-- The poster, pinned slightly crooked -->
  <rect x="126" y="76" width="560" height="420" fill="#000" opacity="0.18" transform="rotate(-2 400 280)"/>
  <g id="poster" transform="rotate(-2 400 280)" font-family="sans-serif">
    <rect x="120" y="70" width="560" height="420" fill="#fbfaf6"/>
    <rect x="120" y="70" width="560" height="58" fill="#2f7a4f"/>
    <text x="400" y="108" font-size="24" font-weight="700" fill="#ffffff" text-anchor="middle" textLength="510" lengthAdjust="spacingAndGlyphs">Can nutrients speed up algae growth?</text>
    <text x="400" y="152" font-size="15" fill="#5a5a5a" text-anchor="middle">Year 9 · Team 4 · Junior Science Fair 2026</text>

    <g id="method">
      <rect x="140" y="168" width="236" height="128" fill="#ffffff" stroke="#d6d0c2" stroke-width="2"/>
      <text x="154" y="192" font-size="17" font-weight="700" fill="#2f7a4f">Method</text>
      <g font-size="15" fill="#3a3a3a">
        <text x="154" y="216">Two tanks of pond algae.</text>
        <text x="154" y="238">Tank A: nutrient added.</text>
        <text x="154" y="260">Tank B: control.</text>
        <text x="154" y="282">Weighed daily for 7 days.</text>
      </g>
    </g>

    <g id="conclusion">
      <rect x="140" y="310" width="236" height="164" fill="#ffffff" stroke="#d6d0c2" stroke-width="2"/>
      <text x="154" y="334" font-size="17" font-weight="700" fill="#2f7a4f">Conclusion</text>
      <g font-size="15" fill="#3a3a3a">
        <text x="154" y="358">The nutrient made the</text>
        <text x="154" y="378">algae grow much faster.</text>
      </g>
      <rect x="150" y="394" width="216" height="64" rx="4" fill="#e8f3ec" stroke="#2f7a4f" stroke-width="3"/>
      <text x="258" y="436" font-size="28" font-weight="700" fill="#2f7a4f" text-anchor="middle">+255% growth</text>
    </g>

    <g id="chart">
      <rect x="396" y="168" width="264" height="306" fill="#ffffff" stroke="#d6d0c2" stroke-width="2"/>
      <text x="528" y="194" font-size="16" font-weight="700" fill="#3a3a3a" text-anchor="middle">Mass after 7 days (g)</text>
      <path d="M446 380h200M446 328h200M446 276h200M446 224h200" stroke="#ece8de" stroke-width="1.5"/>
      <g font-size="13" fill="#5a5a5a" text-anchor="end">
        <text x="438" y="437">0</text><text x="438" y="385">2</text><text x="438" y="333">4</text><text x="438" y="281">6</text><text x="438" y="229">8</text>
      </g>
      <!-- 26 px per gram: 7.1 g = 185 px, 2.5 g = 65 px -->
      <rect x="470" y="247" width="66" height="185" fill="#2f7a4f"/>
      <rect x="524" y="247" width="12" height="185" fill="#245f3d"/>
      <rect x="566" y="367" width="66" height="65" fill="#9aa4ad"/>
      <rect x="620" y="367" width="12" height="65" fill="#838d96"/>
      <path d="M446 224V432H646" stroke="#3a3a3a" stroke-width="2" fill="none"/>
      <g font-weight="700" font-size="18" fill="#3a3a3a" text-anchor="middle">
        <text x="503" y="239">7.1 g</text>
        <text x="599" y="359">2.5 g</text>
      </g>
      <g text-anchor="middle">
        <text x="503" y="452" font-size="15" font-weight="700" fill="#3a3a3a">Tank A</text>
        <text x="599" y="452" font-size="15" font-weight="700" fill="#3a3a3a">Tank B</text>
        <text x="503" y="468" font-size="12" fill="#6a6a6a">nutrient</text>
        <text x="599" y="468" font-size="12" fill="#6a6a6a">control</text>
      </g>
    </g>

    <path d="M120 70H300L180 490H120z" fill="#ffffff" opacity="0.08"/>
    <g fill="#d94a3d">
      <circle cx="130" cy="80" r="6"/><circle cx="670" cy="80" r="6"/><circle cx="130" cy="480" r="6"/><circle cx="670" cy="480" r="6"/>
    </g>
    <g fill="#f6f4ef"><circle cx="128" cy="78" r="2"/><circle cx="668" cy="78" r="2"/><circle cx="128" cy="478" r="2"/><circle cx="668" cy="478" r="2"/></g>
  </g>

  <!-- Lab bench: black benchtop, pale cupboards -->
  <g id="bench">
    <rect y="516" width="800" height="40" fill="#2f383e"/>
    <rect y="556" width="800" height="10" fill="#232a2f"/>
    <rect y="566" width="800" height="34" fill="#dcd5c8"/>
    <path d="M200 566V600M400 566V600M600 566V600" stroke="#c4bcad" stroke-width="3"/>
    <g fill="#8a8f94"><rect x="180" y="576" width="12" height="4" rx="2"/><rect x="208" y="576" width="12" height="4" rx="2"/><rect x="580" y="576" width="12" height="4" rx="2"/><rect x="608" y="576" width="12" height="4" rx="2"/></g>
  </g>

  <!-- Beaker of algae water -->
  <g id="beaker">
    <ellipse cx="88" cy="542" rx="30" ry="4" fill="#000" opacity="0.25"/>
    <path d="M66 470h44v66q0 6 -6 6h-32q-6 0 -6 -6z" fill="#a8cbdc" opacity="0.45"/>
    <path d="M66 500h44v36q0 6 -6 6h-32q-6 0 -6 -6z" fill="#3f8f4f" opacity="0.85"/>
    <path d="M70 484h10M70 496h10M70 508h10M70 520h10" stroke="#f6f4ef" stroke-width="1.5"/>
    <rect x="62" y="466" width="52" height="5" rx="2" fill="#cfe2ea"/>
  </g>

  <!-- Small algae tank -->
  <g id="tank">
    <ellipse cx="744" cy="542" rx="50" ry="5" fill="#000" opacity="0.25"/>
    <rect x="700" y="452" width="88" height="88" fill="#a8cbdc" opacity="0.45"/>
    <rect x="702" y="470" width="84" height="68" fill="#6fb08f" opacity="0.75"/>
    <path d="M716 538q-6 -20 2 -40M736 538q6 -24 -2 -48M758 538q-4 -18 4 -36M774 538q4 -14 -2 -28" stroke="#2f7a4f" stroke-width="3" fill="none"/>
    <rect x="700" y="452" width="88" height="88" fill="none" stroke="#cfe2ea" stroke-width="3"/>
    <rect x="696" y="446" width="96" height="8" fill="#5a6066"/>
  </g>
</svg>
