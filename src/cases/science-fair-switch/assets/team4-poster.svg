<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="A science fair poster about algae growth with a bar chart">
  <rect width="800" height="600" fill="#6b5a48"/>
  <rect x="40" y="30" width="720" height="540" fill="#3b4a5c"/>
  <rect x="60" y="50" width="680" height="500" fill="#f4f1e8"/>
  <rect x="60" y="50" width="680" height="70" fill="#2f7d5b"/>
  <text x="400" y="95" font-family="sans-serif" font-size="30" font-weight="700" fill="#ffffff" text-anchor="middle">Can nutrients speed up algae growth?</text>
  <text x="400" y="145" font-family="sans-serif" font-size="16" fill="#3a3a3a" text-anchor="middle">Year 9 Team 4 · Junior Science Fair 2026</text>
  <g font-family="sans-serif" font-size="14" fill="#3a3a3a">
    <rect x="90" y="175" width="250" height="150" fill="#ffffff" stroke="#c9c2b0"/>
    <text x="105" y="200" font-weight="700">Method</text>
    <text x="105" y="225">Two tanks of pond algae.</text>
    <text x="105" y="245">Tank A: nutrient added.</text>
    <text x="105" y="265">Tank B: control, no nutrient.</text>
    <text x="105" y="285">Weighed every day for 7 days.</text>
    <rect x="90" y="345" width="250" height="180" fill="#ffffff" stroke="#c9c2b0"/>
    <text x="105" y="370" font-weight="700">Conclusion</text>
    <text x="105" y="395">Nutrient made the algae</text>
    <text x="105" y="415">grow much faster.</text>
    <rect x="105" y="440" width="200" height="60" fill="#e8f3ec" stroke="#2f7d5b"/>
    <text x="205" y="478" font-size="22" font-weight="700" fill="#2f7d5b" text-anchor="middle">+255% growth</text>
  </g>
  <rect x="370" y="175" width="340" height="350" fill="#ffffff" stroke="#c9c2b0"/>
  <text x="540" y="200" font-family="sans-serif" font-size="15" font-weight="700" fill="#3a3a3a" text-anchor="middle">Mass after 7 days (g)</text>
  <line x1="410" y1="480" x2="690" y2="480" stroke="#3a3a3a" stroke-width="2"/>
  <line x1="410" y1="220" x2="410" y2="480" stroke="#3a3a3a" stroke-width="2"/>
  <rect x="450" y="250" width="80" height="230" fill="#2f7d5b"/>
  <rect x="580" y="400" width="80" height="80" fill="#9aa4ad"/>
  <text x="490" y="242" font-family="sans-serif" font-size="14" fill="#3a3a3a" text-anchor="middle">7.1</text>
  <text x="620" y="392" font-family="sans-serif" font-size="14" fill="#3a3a3a" text-anchor="middle">2.5</text>
  <text x="490" y="502" font-family="sans-serif" font-size="13" fill="#3a3a3a" text-anchor="middle">Tank A</text>
  <text x="620" y="502" font-family="sans-serif" font-size="13" fill="#3a3a3a" text-anchor="middle">Tank B</text>
  <rect x="444" y="228" width="92" height="22" fill="#f7f7f2" opacity="0.55"/>
  <text x="540" y="518" font-family="sans-serif" font-size="11" fill="#7a7a7a" text-anchor="middle">Tank A: nutrient · Tank B: control</text>
</svg>
