    <circle cx="470" cy="458" r="10" fill="#8d5a3b"/>
    <rect x="568" y="446" width="30" height="80" rx="4" fill="#f6f4ef"/>
    <path d="M568 470h30M568 492h30" stroke="#3d8fb3" stroke-width="5"/>
