<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Infrared trail camera photo at night: a brushtail possum sitting on the snack box lid on the Cabin 4 verandah, with a torn chip packet beside the box">
  <!-- Same camera and framing as trailcam-0112.svg. The CCTV app draws the camera name and time overlay. -->
  <defs>
    <!-- The infrared flash lights the middle of the frame; the corners fall away to black -->
    <radialGradient id="falloff" gradientUnits="userSpaceOnUse" cx="0" cy="0" r="1" gradientTransform="translate(470 440) scale(620 420)">
      <stop offset="0.45" stop-color="#000" stop-opacity="0"/>
      <stop offset="0.8" stop-color="#000" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.85"/>
    </radialGradient>
    <!-- Sensor noise: two tiles of different sizes so the repeat doesn't show -->
    <pattern id="noise-light" width="67" height="67" patternUnits="userSpaceOnUse" patternTransform="scale(2)">
      <path fill="#fff" d="M0 61h2v2h-2zM14 48h1v1h-1zM22 50h1v1h-1zM36 45h1v1h-1zM54 16h1v1h-1zM47 46h2v2h-2zM45 31h1v1h-1zM54 8h1v1h-1zM61 46h1v1h-1zM38 61h1v1h-1zM24 22h1v1h-1zM22 10h2v2h-2zM28 19h1v1h-1zM37 48h1v1h-1zM3 18h1v1h-1zM34 28h2v2h-2zM60 3h1v1h-1zM23 44h1v1h-1zM34 11h1v1h-1zM19 24h1v1h-1zM22 35h1v1h-1zM15 60h1v1h-1zM57 42h1v1h-1zM34 33h1v1h-1zM62 26h1v1h-1zM16 39h1v1h-1zM22 26h1v1h-1zM58 7h1v1h-1zM5 27h2v2h-2zM5 66h2v2h-2zM42 9h1v1h-1zM39 9h1v1h-1zM59 59h1v1h-1zM60 50h2v2h-2zM0 16h2v2h-2zM0 41h2v2h-2zM49 32h1v1h-1zM15 59h2v2h-2zM25 59h2v2h-2zM32 0h1v1h-1zM42 61h2v2h-2zM60 12h1v1h-1zM37 45h2v2h-2zM14 13h1v1h-1zM3 51h1v1h-1zM47 33h2v2h-2zM7 61h2v2h-2zM46 59h2v2h-2zM59 57h1v1h-1zM63 51h1v1h-1zM16 48h1v1h-1zM26 15h1v1h-1zM59 37h1v1h-1zM41 49h1v1h-1zM48 28h2v2h-2zM20 66h1v1h-1zM42 58h1v1h-1zM13 43h2v2h-2zM33 37h1v1h-1zM63 32h2v2h-2zM29 11h1v1h-1zM34 37h1v1h-1zM50 24h1v1h-1zM1 20h1v1h-1z"/>
    </pattern>
    <pattern id="noise-dark" width="53" height="53" patternUnits="userSpaceOnUse" patternTransform="scale(2)">
      <path fill="#000" d="M1 7h2v2h-2zM5 4h2v2h-2zM32 50h2v2h-2zM7 10h1v1h-1zM12 24h1v1h-1zM22 35h1v1h-1zM21 22h2v2h-2zM12 42h1v1h-1zM8 49h1v1h-1zM6 11h1v1h-1zM9 4h2v2h-2zM34 29h1v1h-1zM52 3h1v1h-1zM16 0h2v2h-2zM21 4h2v2h-2zM48 41h1v1h-1zM23 45h1v1h-1zM42 35h1v1h-1zM18 21h1v1h-1zM26 30h1v1h-1zM35 33h1v1h-1zM46 44h1v1h-1zM23 25h1v1h-1zM51 18h2v2h-2zM18 46h1v1h-1zM39 50h1v1h-1zM10 12h1v1h-1zM5 48h1v1h-1zM33 37h1v1h-1zM46 14h1v1h-1zM23 20h2v2h-2zM31 12h1v1h-1zM43 17h1v1h-1zM46 6h1v1h-1zM48 0h2v2h-2zM47 9h2v2h-2zM50 37h2v2h-2zM6 33h2v2h-2zM43 31h1v1h-1zM6 17h1v1h-1zM50 29h1v1h-1zM41 37h1v1h-1zM31 5h2v2h-2zM13 11h1v1h-1zM33 43h2v2h-2zM21 41h1v1h-1zM26 43h1v1h-1zM48 45h2v2h-2zM38 8h2v2h-2zM50 50h2v2h-2zM46 50h2v2h-2zM29 7h1v1h-1zM25 12h2v2h-2zM24 42h1v1h-1zM27 37h1v1h-1zM42 9h2v2h-2zM38 34h1v1h-1zM28 20h1v1h-1z"/>
    </pattern>
    <filter id="fur" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="0.8"/></filter>
    <filter id="shine" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="2.5"/></filter>
  </defs>

  <g id="scene">
    <!-- Night bush behind the cabins -->
    <rect width="800" height="500" fill="#0b0b0b"/>
    <path id="tree-line" d="M0 0H800V120L470 150Q456 160 440 150Q430 172 404 168Q390 186 360 180Q340 200 312 196Q296 214 268 212Q250 226 226 222Q200 234 170 228Q150 236 120 230Q96 238 70 232Q40 240 0 234Z" fill="#1c1c1c"/>
    <g id="far-trees" fill="#262626">
      <ellipse cx="110" cy="80" rx="70" ry="44"/>
      <ellipse cx="300" cy="100" rx="60" ry="36"/>
    </g>
    <g id="woollybutt-trunks" fill="#383838">
      <path d="M106 240l2 -150h10l2 150z"/>
      <path d="M299 232l1 -112h8l1 112z"/>
    </g>

    <!-- Red-earth verge (reads grey in infrared), nearer ground lit by the flash -->
    <path d="M0 228L800 224V500H0Z" fill="#555"/>
    <path d="M0 330L800 340V500H0Z" fill="#686868"/>

    <!-- Termite mound and a pandanus on the verge -->
    <g id="termite-mound">
      <path d="M68 262q4 -30 14 -44q4 -18 12 -20q8 4 10 22q12 14 16 42z" fill="#5c5c5c"/>
      <path d="M96 198q8 4 10 22q12 14 16 42h-18q2 -36 -8 -64z" fill="#4a4a4a"/>
    </g>
    <g id="pandanus">
      <path d="M174 292q2 -44 12 -86" stroke="#4a4a4a" stroke-width="6" fill="none"/>
      <path d="M164 292l10 -20M184 292l-8 -22" stroke="#4a4a4a" stroke-width="3"/>
      <path fill="#5a5a5a" d="M186 206l-42 -4l40 -4zM186 206l-34 -26l36 20zM186 206l-10 -38l14 36zM186 206l18 -36l-14 38zM186 206l40 -20l-38 24zM186 206l44 6l-42 0zM186 206l30 24l-32 -18zM186 206l-36 22l32 -18z"/>
    </g>

    <!-- Gravel track running away from the camera -->
    <g id="track">
      <path d="M20 500L238 224H262L560 500Z" fill="#7a7a7a"/>
      <path d="M170 500L246 224H254L380 500Z" fill="#878787"/>
      <g fill="#9a9a9a">
        <ellipse cx="220" cy="470" rx="5" ry="3"/><ellipse cx="300" cy="440" rx="4" ry="2"/><ellipse cx="160" cy="430" rx="4" ry="2"/>
        <ellipse cx="350" cy="480" rx="6" ry="3"/><ellipse cx="260" cy="380" rx="3" ry="2"/><ellipse cx="420" cy="470" rx="5" ry="3"/>
      </g>
    </g>

    <!-- Cabin 5, further along the track, mostly in the dark -->
    <g id="cabin-5">
      <path d="M330 175L445 117V323L330 259Z" fill="#262626"/>
      <path d="M328 172L447 113V121L328 180Z" fill="#3a3a3a"/>
      <path d="M330 248L445 295" stroke="#3a3a3a" stroke-width="3"/>
      <path d="M390 145V272M440 120V293" stroke="#333" stroke-width="4"/>
    </g>

    <!-- Cabin 4 verandah at the right edge (lines meet near the end of the track) -->
    <g id="cabin-4">
      <path id="ceiling" d="M470 105L800 -60V40L470 145Z" fill="#262626"/>
      <path d="M490 95H627M540 70H706M620 30H800" stroke="#363636" stroke-width="4"/>
      <path id="wall" d="M470 145L800 40V340L470 265Z" fill="#626262"/>
      <path d="M470 161L800 80M470 173L800 110M470 185L800 140M470 197L800 170M470 209L800 200M470 221L800 230M470 233L800 260M470 245L800 290M470 257L800 320" stroke="#575757" stroke-width="2"/>
      <g id="window">
        <path d="M600 136L690 115V243L600 237Z" fill="#1a1a1a" stroke="#858585" stroke-width="4"/>
        <path d="M645 126V240" stroke="#858585" stroke-width="3"/>
      </g>
      <path id="floor" d="M470 265L800 340V440L470 305Z" fill="#8c8c8c"/>
      <path d="M470 275L800 365M470 285L800 390M470 295L800 415" stroke="#7a7a7a" stroke-width="2"/>
      <path id="fascia" d="M470 305L800 440V462L470 314Z" fill="#5e5e5e"/>
      <path id="under-floor" d="M470 314L569 358V392L470 337Z" fill="#1c1c1c"/>
      <rect x="482" y="318" width="8" height="24" fill="#4a4a4a"/>
    </g>

    <!-- The snack box: lid pushed up at the far end, dark gap underneath -->
    <g id="snack-box">
      <path d="M585 279L705 302V385L585 340Z" fill="#bdbdbd"/>
      <path d="M705 302H735V385H705Z" fill="#9e9e9e"/>
      <path d="M585 292L705 316" stroke="#a8a8a8" stroke-width="3"/>
      <path d="M624 286L705 302L735 302L739 291L709 291Z" fill="#141414"/>
      <path d="M583 276L709 283H739L613 276Z" fill="#dadada"/>
      <path d="M583 276L709 283V291L583 284Z" fill="#cfcfcf"/>
      <path d="M709 283H739V291H709Z" fill="#b4b4b4"/>
    </g>

    <!-- Torn chip packet on the boards beside the box, with a few chips -->
    <g id="chip-packet">
      <path d="M726 392L764 384L784 396L780 414L770 410L762 420L752 412L736 410L728 406Z" fill="#e2e2e2"/>
      <path d="M730 404L752 412L762 420L770 410L780 414L782 404Z" fill="#bdbdbd"/>
      <path d="M728 394l-4 6l5 2l-3 6" stroke="#9a9a9a" stroke-width="2" fill="none"/>
      <g fill="#d6d6d6"><circle cx="716" cy="398" r="3"/><circle cx="708" cy="392" r="2.5"/><circle cx="720" cy="390" r="2"/></g>
    </g>

    <!-- The possum, sitting on the lid and looking at the camera -->
    <g id="possum" filter="url(#fur)">
      <path id="tail" d="M662 258Q696 262 702 294Q708 328 696 356Q690 368 680 366Q690 350 688 326Q686 296 658 282Z" fill="#262626"/>
      <ellipse cx="636" cy="252" rx="40" ry="30" fill="#aaa"/>
      <ellipse cx="650" cy="246" rx="26" ry="22" fill="#939393"/>
      <ellipse cx="660" cy="272" rx="16" ry="10" fill="#999"/>
      <ellipse cx="618" cy="262" rx="18" ry="18" fill="#c6c6c6"/>
      <g fill="#a2a2a2"><rect x="606" y="262" width="10" height="20" rx="5"/><rect x="620" y="264" width="10" height="19" rx="5"/></g>
      <path d="M588 210l-6 -26l18 16zM610 204l8 -24l8 22z" fill="#8e8e8e"/>
      <path d="M590 206l-4 -16l10 10zM614 201l4 -14l5 13z" fill="#d4d4d4"/>
      <ellipse cx="604" cy="222" rx="21" ry="19" fill="#ababab"/>
      <ellipse cx="594" cy="232" rx="11" ry="9" fill="#c8c8c8"/>
      <ellipse cx="588" cy="236" rx="4" ry="3" fill="#3a3a3a"/>
      <g fill="#3a3a3a"><ellipse cx="597" cy="218" rx="5" ry="4"/><ellipse cx="612" cy="216" rx="5" ry="4"/></g>
    </g>
    <g id="eye-shine" fill="#fff">
      <g filter="url(#shine)" opacity="0.6"><circle cx="597" cy="218" r="6"/><circle cx="612" cy="216" r="6"/></g>
      <circle cx="597" cy="218" r="3"/><circle cx="612" cy="216" r="3"/>
    </g>

    <!-- Verandah posts, rail and the step (in front of the box) -->
    <g id="posts-and-rail">
      <path d="M465 104H475V314H465Z" fill="#9a9a9a"/>
      <path d="M569 52H581V362H569Z" fill="#a0a0a0"/>
      <path d="M577 52H581V362H577Z" fill="#7c7c7c"/>
      <path d="M475 188L569 177V185L475 196Z" fill="#a8a8a8"/>
      <path d="M475 248L569 262V268L475 254Z" fill="#9a9a9a"/>
    </g>
    <g id="step">
      <path d="M581 364L800 462V478L563 380Z" fill="#9c9c9c"/>
      <path d="M563 380L800 478V500L563 402Z" fill="#6a6a6a"/>
    </g>

    <!-- Dry spear grass close to the camera -->
    <g id="grass" fill="none" stroke-linecap="round">
      <path d="M14 500q2 -46 -10 -76M30 500q-2 -36 -18 -58M48 500q2 -40 -6 -66M66 500q6 -40 24 -60M90 500q-4 -28 -16 -42" stroke="#7e7e7e" stroke-width="3"/>
      <path d="M10 500q4 -40 -6 -70M20 500q2 -50 12 -84M40 500q6 -44 22 -66M56 500q0 -30 -10 -52M76 500q4 -40 20 -58M104 500q2 -26 10 -40" stroke="#a8a8a8" stroke-width="3"/>
    </g>
  </g>

  <!-- Camera effects: flash falloff, then sensor noise -->
  <rect width="800" height="500" fill="url(#falloff)"/>
  <rect width="800" height="500" fill="url(#noise-light)" opacity="0.18"/>
  <rect width="800" height="500" fill="url(#noise-dark)" opacity="0.22"/>
</svg>
