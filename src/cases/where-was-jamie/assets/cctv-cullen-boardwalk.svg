<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="CCTV still of a marina boardwalk at dusk">
  <defs>
    <filter id="mono">
      <feColorMatrix type="saturate" values="0.45"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="1.1" numOctaves="2" seed="5"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <filter id="blur"><feGaussianBlur stdDeviation="1.8"/></filter>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3d3f5c"/><stop offset="1" stop-color="#c98a6a"/>
    </linearGradient>
    <radialGradient id="vig" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0.6" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.7"/>
    </radialGradient>
  </defs>
  <g filter="url(#mono)">
    <rect width="800" height="210" fill="url(#sky)"/>
    <rect y="210" width="800" height="120" fill="#4d5b6e"/>
    <!-- moored boats with masts -->
    <g fill="#d9d6cf">
      <path d="M60 250 h140 l-20 26 h-100z"/><path d="M260 246 h120 l-16 24 h-88z"/><path d="M450 252 h150 l-22 26 h-108z"/>
    </g>
    <g stroke="#2a2c33" stroke-width="3">
      <line x1="130" y1="250" x2="130" y2="110"/><line x1="320" y1="246" x2="320" y2="90"/><line x1="525" y1="252" x2="525" y2="120"/>
      <line x1="660" y1="248" x2="660" y2="130"/>
    </g>
    <!-- boardwalk -->
    <polygon points="0,330 800,300 800,500 0,500" fill="#8a6f55"/>
    <g stroke="#6f5845" stroke-width="3">
      <line x1="0" y1="370" x2="800" y2="345"/><line x1="0" y1="420" x2="800" y2="400"/><line x1="0" y1="470" x2="800" y2="455"/>
    </g>
    <g fill="#2a2c33"><rect x="0" y="318" width="800" height="6"/><rect x="100" y="300" width="6" height="30"/><rect x="300" y="294" width="6" height="30"/><rect x="500" y="288" width="6" height="30"/><rect x="700" y="282" width="6" height="30"/></g>
    <!-- lamp -->
    <rect x="740" y="170" width="6" height="140" fill="#2a2c33"/><circle cx="743" cy="168" r="10" fill="#f1e6c6"/>
    <!-- figure with backpack, side-on, blurred -->
    <g filter="url(#blur)">
      <ellipse cx="300" cy="455" rx="30" ry="7" fill="#000" opacity="0.3"/>
      <circle cx="300" cy="340" r="16" fill="#3a2e28"/>
      <path d="M282 360 q18 -8 36 0 l4 58 q-22 6 -44 0z" fill="#d8d3c8"/>
      <rect x="312" y="360" width="20" height="40" rx="7" fill="#4f7d4c"/>
      <rect x="284" y="414" width="14" height="38" fill="#26262a"/><rect x="302" y="414" width="14" height="38" fill="#26262a"/>
      <!-- phone held up -->
      <rect x="268" y="344" width="10" height="16" rx="2" fill="#111"/>
    </g>
  </g>
  <rect width="800" height="500" fill="url(#vig)"/>
  <rect width="800" height="500" filter="url(#grain)" opacity="0.3" style="mix-blend-mode:overlay"/>
</svg>
