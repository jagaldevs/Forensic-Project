    <path d="M400 298q12 10 24 0" stroke="#2b2322" stroke-width="2.8" fill="none" stroke-linecap="round"/>
    <g fill="#e27a5f" opacity="0.25"><circle cx="394" cy="296" r="5"/><circle cx="430" cy="296" r="5"/></g>
  </g>

