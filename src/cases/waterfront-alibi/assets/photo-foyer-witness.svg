<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Convention centre foyer at night">
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#050a18"/>
      <stop offset="1" stop-color="#14254a"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3632"/>
      <stop offset="1" stop-color="#1c1a18"/>
    </linearGradient>
    <linearGradient id="ceiling" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#121216"/>
      <stop offset="1" stop-color="#26262c"/>
    </linearGradient>
    <linearGradient id="caseGlass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#bfe3ff" stop-opacity="0.28"/>
      <stop offset="0.5" stop-color="#bfe3ff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#bfe3ff" stop-opacity="0.22"/>
    </linearGradient>
    <linearGradient id="hoodie" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c1d24"/>
      <stop offset="1" stop-color="#0d0d12"/>
    </linearGradient>
    <radialGradient id="spot" cx="0.5" cy="0" r="1">
      <stop offset="0" stop-color="#fff4d6" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#fff4d6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0.5" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.7"/>
    </radialGradient>
    <filter id="blurMove"><feGaussianBlur stdDeviation="2.4 0.8"/></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="3"/>
      <feColorMatrix type="saturate" values="0"/>
      
      
    </filter>
  </defs>

  <!-- Ceiling and lights -->
  <rect width="800" height="120" fill="url(#ceiling)"/>
  <g fill="#fff6dc">
    <ellipse cx="150" cy="40" rx="30" ry="5"/><ellipse cx="400" cy="34" rx="34" ry="5"/><ellipse cx="650" cy="40" rx="30" ry="5"/>
  </g>

  <!-- Glass wall with harbour at night -->
  <rect x="0" y="110" width="800" height="250" fill="url(#night)"/>
  <rect x="0" y="300" width="800" height="60" fill="#0a1630"/>
  <g filter="url(#soft)">
    <g fill="#ffcf7a" opacity="0.85">
      <rect x="40" y="262" width="4" height="40"/><rect x="120" y="270" width="3" height="34"/><rect x="510" y="266" width="4" height="38"/>
      <rect x="610" y="258" width="3" height="46"/><rect x="700" y="268" width="4" height="36"/>
    </g>
    <g fill="#ffcf7a" opacity="0.35">
      <rect x="38" y="306" width="8" height="40"/><rect x="508" y="306" width="8" height="40"/><rect x="608" y="306" width="7" height="44"/>
    </g>
    <g fill="#9fd0ff" opacity="0.7"><circle cx="300" cy="278" r="3"/><circle cx="330" cy="282" r="2.5"/><circle cx="760" cy="276" r="3"/></g>
  </g>
  <!-- Mullions -->
  <g fill="#1d1f26"><rect x="0" y="110" width="800" height="10"/><rect x="190" y="110" width="8" height="250"/><rect x="398" y="110" width="8" height="250"/><rect x="606" y="110" width="8" height="250"/></g>
  <!-- Reflections on glass -->
  <polygon points="220,120 260,120 200,360 160,360" fill="#ffffff" opacity="0.04"/>
  <polygon points="640,120 690,120 630,360 580,360" fill="#ffffff" opacity="0.05"/>

  <!-- Floor -->
  <polygon points="0,360 800,360 800,600 0,600" fill="url(#floor)"/>
  <g stroke="#4a4540" stroke-width="1" opacity="0.6">
    <line x1="400" y1="360" x2="-200" y2="600"/><line x1="400" y1="360" x2="100" y2="600"/><line x1="400" y1="360" x2="400" y2="600"/>
    <line x1="400" y1="360" x2="700" y2="600"/><line x1="400" y1="360" x2="1000" y2="600"/>
    <line x1="0" y1="400" x2="800" y2="400"/><line x1="0" y1="460" x2="800" y2="460"/><line x1="0" y1="540" x2="800" y2="540"/>
  </g>

  <!-- Banner -->
  <g transform="translate(300 128)">
    <rect width="260" height="70" fill="#7a0f4a"/>
    <rect x="6" y="6" width="248" height="58" fill="none" stroke="#f3c6dd" stroke-width="1.5" opacity="0.7"/>
    <text x="130" y="32" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="18" fill="#ffffff">TOP END ROBOTICS CUP</text>
    <text x="130" y="54" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#f3c6dd">2026 · Grand Final</text>
  </g>
  <line x1="310" y1="110" x2="310" y2="128" stroke="#555" stroke-width="2"/>
  <line x1="550" y1="110" x2="550" y2="128" stroke="#555" stroke-width="2"/>

  <!-- Spotlight on display -->
  <polygon points="430,110 520,110 600,430 360,430" fill="url(#spot)"/>

  <!-- Display plinth and glass case -->
  <rect x="420" y="330" width="120" height="120" fill="#e9e4dc"/>
  <rect x="420" y="330" width="120" height="8" fill="#ffffff"/>
  <rect x="420" y="440" width="120" height="10" fill="#c8c1b6"/>
  <rect x="430" y="232" width="100" height="98" fill="url(#caseGlass)" stroke="#d9efff" stroke-opacity="0.5"/>
  <!-- Trophy (partly hidden by glare) -->
  <g opacity="0.8">
    <path d="M462 256 h36 q0 30 -18 36 q-18 -6 -18 -36z" fill="#d8b44a"/>
    <rect x="474" y="292" width="12" height="16" fill="#c49b33"/>
    <rect x="464" y="308" width="32" height="10" fill="#7a6326"/>
  </g>
  <polygon points="440,236 470,236 450,328 432,328" fill="#ffffff" opacity="0.18"/>
  <text x="480" y="400" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#555">PLEASE DO NOT TOUCH</text>

  <!-- Person in dark hoodie, back to camera (motion blurred) -->
  <g filter="url(#blurMove)">
    <path d="M300 300 q36 -24 72 0 l14 120 q-50 14 -100 0z" fill="url(#hoodie)"/>
    <path d="M308 232 q28 -26 56 0 q8 30 -6 58 q-22 12 -44 0 q-14 -28 -6 -58z" fill="#16171d"/>
    <path d="M316 240 q20 -16 40 0" fill="none" stroke="#2a2b33" stroke-width="3"/>
    <path d="M300 300 l-20 90 l14 4 l22 -80z" fill="#121318"/>
    <path d="M372 300 l26 70 l-12 8 l-24 -60z" fill="#121318"/>
    <rect x="304" y="418" width="30" height="110" fill="#1e2230"/>
    <rect x="340" y="418" width="30" height="110" fill="#1e2230"/>
    <rect x="300" y="524" width="36" height="14" rx="5" fill="#0c0c0f"/>
    <rect x="338" y="524" width="36" height="14" rx="5" fill="#0c0c0f"/>
  </g>
  <ellipse cx="340" cy="540" rx="60" ry="8" fill="#000" opacity="0.35"/>

  <!-- Distant blurred visitor -->
  <g filter="url(#soft)" opacity="0.55">
    <circle cx="690" cy="318" r="10" fill="#6b5d52"/>
    <rect x="678" y="328" width="24" height="56" rx="8" fill="#43506a"/>
    <rect x="680" y="384" width="8" height="34" fill="#2b2b33"/><rect x="692" y="384" width="8" height="34" fill="#2b2b33"/>
  </g>

  <!-- Pillar -->
  <rect x="60" y="110" width="50" height="490" fill="#2b2a30"/>
  <rect x="60" y="110" width="8" height="490" fill="#3a3940"/>

  <rect width="800" height="600" fill="url(#vignette)"/>
  <rect width="800" height="600" filter="url(#grain)" opacity="0.32" style="mix-blend-mode:overlay"/>
</svg>
