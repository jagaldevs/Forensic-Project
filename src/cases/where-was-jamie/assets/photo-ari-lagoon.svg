<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Three teenagers with towels beside the Waterfront wave lagoon in late afternoon light">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ec5e6"/>
      <stop offset="1" stop-color="#f6d9ab"/>
    </linearGradient>
    <linearGradient id="lagoon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5fcad6"/>
      <stop offset="1" stop-color="#2f9db0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff1c9"/>
      <stop offset="1" stop-color="#fff1c9" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Sky, with the low sun in the west -->
