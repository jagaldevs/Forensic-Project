<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Grainy infrared trail camera still at night: two bright eye-shine dots and a dark shape near a verandah rail">
  <title>Trail camera, 1:12 am: grainy infrared still with eye-shine near the verandah rail</title>
  <defs>
    <filter id="mono">
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="1.3" numOctaves="2" seed="4"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <filter id="blur"><feGaussianBlur stdDeviation="5"/></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="2.2"/></filter>
    <filter id="glow"><feGaussianBlur stdDeviation="1.6"/></filter>
    <radialGradient id="flash" cx="0.45" cy="0.7" r="0.7">
      <stop offset="0" stop-color="#9a9a9a"/>
      <stop offset="0.55" stop-color="#5a5a5a"/>
      <stop offset="1" stop-color="#1c1c1c"/>
    </radialGradient>
  </defs>
  <g filter="url(#mono)">
    <rect width="800" height="500" fill="url(#flash)"/>
    <!-- dark bush behind the track -->
    <g fill="#2a2a2a" filter="url(#soft)">
      <ellipse cx="90" cy="150" rx="140" ry="110"/>
      <ellipse cx="300" cy="110" rx="160" ry="90"/>
      <ellipse cx="480" cy="130" rx="120" ry="80"/>
    </g>
    <!-- gravel track running away from the camera -->
    <polygon points="140,500 380,230 470,230 620,500" fill="#8c8c8c" opacity="0.55"/>
    <g fill="#b0b0b0" opacity="0.35">
      <circle cx="300" cy="420" r="3"/><circle cx="420" cy="380" r="2"/><circle cx="510" cy="450" r="3"/>
      <circle cx="360" cy="320" r="2"/><circle cx="450" cy="300" r="2"/><circle cx="250" cy="470" r="3"/>
    </g>
    <!-- grass tufts in the foreground -->
    <g stroke="#bcbcbc" stroke-width="3" fill="none" opacity="0.7" filter="url(#glow)">
      <path d="M40 500 q8 -40 20 -60 M60 500 q2 -50 -10 -80 M80 500 q10 -30 30 -50"/>
      <path d="M700 500 q8 -40 20 -60 M730 500 q2 -50 -10 -80 M760 500 q10 -30 30 -50"/>
    </g>
    <!-- edge of the Cabin 4 verandah, right side -->
    <rect x="610" y="150" width="190" height="16" fill="#6e6e6e"/>
    <rect x="620" y="166" width="12" height="150" fill="#5a5a5a"/>
    <rect x="720" y="166" width="12" height="150" fill="#5a5a5a"/>
    <g stroke="#626262" stroke-width="6">
      <line x1="632" y1="230" x2="800" y2="230"/>
    </g>
    <rect x="600" y="316" width="200" height="22" fill="#4a4a4a"/>
    <!-- a blurry dark shape on the rail, with eye-shine -->
    <g filter="url(#blur)">
      <ellipse cx="672" cy="214" rx="38" ry="22" fill="#2c2c2c"/>
      <ellipse cx="650" cy="206" rx="20" ry="16" fill="#2c2c2c"/>
    </g>
    <g filter="url(#glow)" fill="#ffffff">
      <circle cx="642" cy="202" r="4.5"/>
      <circle cx="656" cy="203" r="4.5"/>
    </g>
  </g>
  <rect width="800" height="500" filter="url(#grain)" opacity="0.4" style="mix-blend-mode:overlay"/>
</svg>
