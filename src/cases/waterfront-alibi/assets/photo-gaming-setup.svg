<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="A dim bedroom gaming setup at night, with a racing game on the monitor">
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d2747"/>
      <stop offset="1" stop-color="#33406b"/>
    </linearGradient>
    <linearGradient id="game-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5b6fb5"/>
      <stop offset="1" stop-color="#f7b267"/>
    </linearGradient>
    <linearGradient id="rgb" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e05aa0"/>
      <stop offset="0.35" stop-color="#e0b24a"/>
      <stop offset="0.7" stop-color="#4fc0cf"/>
      <stop offset="1" stop-color="#8a7fe0"/>
    </linearGradient>
    <radialGradient id="screen-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8fb0ff" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#8fb0ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="warm-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd58a" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#ffd58a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0.55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.5"/>
    </radialGradient>
  </defs>

  <!-- Bedroom wall, lit by the screen and the desk lamp -->
  <rect width="800" height="600" fill="#232839"/>
  <circle cx="430" cy="250" r="320" fill="url(#screen-glow)"/>
  <circle cx="660" cy="320" r="200" fill="url(#warm-glow)" opacity="0.6"/>

  <!-- Window: night outside, a street light and a palm (could be any street) -->
  <g id="window">
    <rect x="40" y="50" width="210" height="240" fill="#3a4058"/>
    <rect x="48" y="58" width="194" height="224" fill="url(#night)"/>
    <g fill="#dfe4f2" opacity="0.8">
      <circle cx="70" cy="112" r="1.5"/><circle cx="200" cy="106" r="1.5"/><circle cx="226" cy="140" r="1.5"/><circle cx="96" cy="210" r="1.5"/>
    </g>
    <circle cx="192" cy="164" r="46" fill="url(#warm-glow)"/>
    <path d="M206 282V160h-12" stroke="#10142a" stroke-width="4" fill="none"/>
    <rect x="184" y="158" width="16" height="6" rx="3" fill="#ffd58a"/>
    <path d="M48 282v-32l40-18l40 18v32z" fill="#151a30"/>
    <path d="M150 282v-20h92v20z" fill="#181d35"/>
    <path d="M110 282Q104 220 124 170" stroke="#10142a" stroke-width="6" fill="none"/>
    <g fill="#10142a">
      <path d="M124 170q-34 -6 -54 18q30 -12 54 -10z"/>
      <path d="M124 170q30 -14 56 4q-30 -6 -56 4z"/>
      <path d="M124 170q-10 -28 -36 -34q22 14 30 36z"/>
      <path d="M124 170q8 -30 34 -36q-20 16 -28 38z"/>
      <path d="M124 170q-24 4 -38 30q22 -18 40 -22z"/>
    </g>
    <rect x="48" y="58" width="194" height="40" fill="#4a5070"/>
    <path d="M48 68h194M48 78h194M48 88h194" stroke="#3a4058" stroke-width="2"/>
    <path d="M230 98v32" stroke="#4a5070" stroke-width="2"/>
    <rect x="143" y="58" width="4" height="224" fill="#3a4058"/>
    <rect x="48" y="168" width="194" height="4" fill="#3a4058"/>
    <rect x="34" y="288" width="222" height="10" fill="#464c66"/>
  </g>

  <!-- Desk -->
  <rect y="404" width="800" height="66" fill="#3d3230"/>
  <rect y="470" width="800" height="18" fill="#2b2321"/>
  <rect y="488" width="800" height="112" fill="#161823"/>
  <ellipse cx="430" cy="430" rx="220" ry="30" fill="#8fb0ff" opacity="0.12"/>

  <!-- Desk lamp: warm light from the right -->
  <g id="lamp">
    <path d="M624 330L678 322L720 420H560z" fill="#ffd58a" opacity="0.12"/>
    <ellipse cx="640" cy="430" rx="90" ry="14" fill="#ffd58a" opacity="0.3"/>
    <ellipse cx="712" cy="418" rx="34" ry="8" fill="#3a3f52"/>
    <path d="M712 416L700 340L652 304" stroke="#3a3f52" stroke-width="6" fill="none" stroke-linejoin="round"/>
    <circle cx="700" cy="340" r="5" fill="#4a5070"/>
    <path d="M630 296L668 290L680 322L622 330z" fill="#e0b24a"/>
    <path d="M668 290L680 322L664 324z" fill="#c99c3c"/>
    <ellipse cx="651" cy="327" rx="28" ry="5" fill="#ffe2a0"/>
  </g>

  <!-- Headphones on a stand -->
  <g id="headphones">
    <ellipse cx="170" cy="418" rx="34" ry="7" fill="#2a2d3a"/>
    <rect x="166" y="262" width="8" height="156" fill="#2a2d3a"/>
    <path d="M150 266Q170 256 190 266" stroke="#2a2d3a" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M126 304Q170 214 214 304" stroke="#1b1d26" stroke-width="10" fill="none"/>
    <rect x="112" y="296" width="28" height="52" rx="12" fill="#1b1d26"/>
    <rect x="200" y="296" width="28" height="52" rx="12" fill="#1b1d26"/>
    <g fill="none" stroke="#4fc0cf" stroke-width="2" opacity="0.8">
      <rect x="118" y="304" width="16" height="36" rx="8"/>
      <rect x="206" y="304" width="16" height="36" rx="8"/>
    </g>
  </g>

  <!-- Mug -->
  <g id="mug">
    <rect x="228" y="398" width="26" height="30" rx="3" fill="#8f8c86"/>
    <path d="M254 404q12 0 12 10q0 10 -12 10" stroke="#8f8c86" stroke-width="4" fill="none"/>
  </g>

  <!-- Monitor with a racing game (fictional, no logos) -->
  <g id="monitor">
    <rect x="416" y="346" width="28" height="56" fill="#1b1d26"/>
    <ellipse cx="430" cy="406" rx="66" ry="9" fill="#1b1d26"/>
    <rect x="248" y="136" width="364" height="216" rx="6" fill="#12141b"/>
    <circle cx="600" cy="346" r="2" fill="#4fc0cf"/>
    <g id="game">
      <rect x="260" y="148" width="340" height="86" fill="url(#game-sky)"/>
      <circle cx="520" cy="214" r="16" fill="#ffe2a0"/>
      <path d="M260 234L300 206L340 224L384 196L430 222L470 204L520 226L560 208L600 228V234z" fill="#6a5a8e"/>
      <rect x="260" y="234" width="340" height="106" fill="#3f8a55"/>
      <path d="M290 340H570L436 234H424z" fill="#4b4c58"/>
      <path d="M424 234L290 340M436 234L570 340" stroke="#e27a5f" stroke-width="4" stroke-dasharray="10 8"/>
      <path d="M430 240V340" stroke="#f6f4ef" stroke-width="3" stroke-dasharray="10 10"/>
      <rect x="432" y="246" width="14" height="8" rx="2" fill="#4fc0cf"/>
      <ellipse cx="430" cy="326" rx="44" ry="6" fill="#000" opacity="0.3"/>
      <rect x="384" y="312" width="12" height="18" rx="3" fill="#15161c"/>
      <rect x="464" y="312" width="12" height="18" rx="3" fill="#15161c"/>
      <path d="M402 298L410 278H450L458 298z" fill="#c8664d"/>
      <path d="M408 296L414 282H446L452 296z" fill="#2d3e66"/>
      <rect x="390" y="296" width="80" height="28" rx="8" fill="#e27a5f"/>
      <rect x="390" y="314" width="80" height="10" rx="4" fill="#c8664d"/>
      <g fill="#ff5a4a"><rect x="396" y="302" width="14" height="6" rx="2"/><rect x="450" y="302" width="14" height="6" rx="2"/></g>
      <rect x="270" y="158" width="44" height="34" rx="4" fill="#000" opacity="0.35"/>
      <path d="M280 182q4 -16 16 -14q12 2 10 12q-2 8 -14 6z" stroke="#f6f4ef" stroke-width="2" fill="none"/>
      <circle cx="296" cy="168" r="2.5" fill="#e0b24a"/>
      <g fill="#f6f4ef" opacity="0.8"><rect x="556" y="160" width="34" height="5" rx="2"/><rect x="566" y="170" width="24" height="5" rx="2"/></g>
      <path d="M558 326A18 18 0 1 1 586 326" stroke="#f6f4ef" stroke-width="3" fill="none" opacity="0.8"/>
      <path d="M572 316L582 304" stroke="#e0b24a" stroke-width="3" stroke-linecap="round"/>
      <path d="M260 148H360L300 340H260z" fill="#fff" opacity="0.04"/>
    </g>
  </g>

  <!-- Mouse -->
  <rect x="586" y="424" width="60" height="46" rx="4" fill="#222532"/>
  <ellipse cx="612" cy="448" rx="13" ry="19" fill="#1b1d26"/>
  <path d="M612 432v8" stroke="#4fc0cf" stroke-width="2"/>

  <!-- Keyboard with coloured key lights -->
  <g id="keyboard">
    <ellipse cx="428" cy="470" rx="150" ry="10" fill="url(#rgb)" opacity="0.25"/>
    <rect x="286" y="424" width="284" height="44" rx="5" fill="#1b1d26"/>
    <g stroke-width="7" opacity="0.9">
      <path d="M296 434h266" stroke="#e05aa0" stroke-dasharray="14 4"/>
      <path d="M296 445h266" stroke="#8a7fe0" stroke-dasharray="14 4"/>
      <path d="M296 456h266" stroke="#4fc0cf" stroke-dasharray="14 4 14 4 14 4 122 4 14 4 14 4 14 4 14 4 14"/>
    </g>
    <rect x="290" y="465" width="276" height="4" rx="2" fill="url(#rgb)"/>
  </g>

  <!-- Empty gaming chair in the foreground -->
  <g id="chair">
    <path d="M30 600V500Q30 470 70 470H170Q210 470 210 500V600z" fill="#181a24"/>
    <path d="M110 476V600" stroke="#e27a5f" stroke-width="10" opacity="0.5"/>
  </g>

  <!-- Phone-camera darkening at the edges -->
  <rect width="800" height="600" fill="url(#vignette)"/>
</svg>
